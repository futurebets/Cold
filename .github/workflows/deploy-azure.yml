name: Deploy to Azure (alternative host)

# Builds the image, pushes it to GitHub Container Registry, and rolls the Azure Container App.
# One-time setup:
#   1. Deploy infra/azure/main.bicep once (see README "Deploy to Azure").
#   2. Create an Entra app with a federated credential for this repo and give it
#      "Contributor" on the resource group. Add repository secrets:
#        AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   3. Add repository variables: AZURE_RESOURCE_GROUP (e.g. cold-rg), AZURE_CONTAINER_APP (e.g. cold)

# Manual only. The default deployment target is Cloudflare (deploy-cloudflare.yml).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_CONTAINER_APP != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the container app
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.img.outputs.name }}"
