# Local production-like run: Cold + PostgreSQL.
#   APP_SECRET=$(openssl rand -hex 32) docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cold
      POSTGRES_PASSWORD: cold
      POSTGRES_DB: cold
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cold"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cold:cold@db:5432/cold
      APP_SECRET: ${APP_SECRET:?set APP_SECRET to 32+ random characters}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
